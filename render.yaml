databases:
  - name: stock-tracker-db
    plan: free
    databaseName: stock_tracker
    user: stock_tracker

services:
  - type: web
    name: stock-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 30 --graceful-timeout 20
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stock-tracker-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: FINNHUB_API_KEY
        sync: false
      # 스위퍼 매매 알림 메일용 (선택 사항 - 비워두면 알림만 조용히 꺼짐, .env.example 참고)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
