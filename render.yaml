databases:
  - name: stock-tracker-db
    plan: free
    databaseName: stock_tracker
    user: stock_tracker

services:
  - type: web
    name: stock-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 30 --graceful-timeout 20
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # 2026-10-16: Supabase로 전환한 뒤에도 이 블루프린트가 배포마다 값을
      # 자동으로 Render 자체 Postgres(stock-tracker-db)로 되돌려버려 운영
      # 데이터(사용자/모의투자 계좌 전부)가 통째로 날아간 사고가 있었다.
      # sync: false로 대시보드에서 수동 설정한 값(Supabase)을 블루프린트가
      # 다시는 덮어쓰지 못하게 한다.
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FINNHUB_API_KEY
        sync: false
      # 스위퍼 매매 알림 메일용 Resend API (선택 사항 - 비워두면 알림만 조용히 꺼짐,
      # .env.example 참고 - SMTP는 Render 컨테이너에서 아웃바운드가 막혀 있어 못 씀)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # 투자 대가 페르소나 토론 기능용 Anthropic API 키 (.env.example 참고 - 비워두면
      # 이 기능만 조용히 꺼짐)
      - key: ANTHROPIC_API_KEY
        sync: false
