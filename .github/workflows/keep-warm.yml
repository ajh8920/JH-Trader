# Render 무료 웹서비스는 15분간 요청이 없으면 컨테이너가 잠든다. 이 앱은 매일
# 한국시간 14:30에 모의투자(어나니머스/스위퍼/와쳐 등) 매매를 처리하고 메일을
# 보내는 백그라운드 스레드(app.py의 paper_trading_scheduler)를 프로세스 안에서
# 직접 스케줄링하는데, 그 시각에 서버가 잠들어 있으면(방문자가 없으면) 스레드
# 자체가 깨어있지 않아 조용히 그날을 건너뛴다(예외가 안 나서 로그에도 안 남는다
# - 2026-09-09 와쳐 알림 메일 누락으로 실제 확인됨. trend_screen_refresher 등
# 다른 주기적 갱신 스레드도 같은 이유로 여러 날 멈춰 있었다).
#
# 해결책: 10분마다(Render의 15분 휴면 기준보다 여유 있게) 이 워크플로우가 사이트에
# 가벼운 요청을 보내 깨어있는 상태를 유지한다. 퍼블릭 저장소라 GitHub Actions
# 사용량은 무료다.
#
# 2026-10-22 추가: 모의투자 배치가 걸리는 한국시간 14:30 직전 구간(14:00~14:55)은
# 10분 간격보다 더 촘촘하게(5분) 핑을 보낸다 - watcher-batch-trigger.yml이 14:30에
# 배치 엔드포인트를 직접 호출하긴 하지만, 그 호출 자체가 "콜드스타트 + 배치 처리"를
# 한 번에 떠안게 하는 대신 이 구간에서 미리 서버를 계속 깨워둬 14:30 호출이 이미
# 따뜻한 상태에서 배치만 바로 시작하게 한다.
name: Keep Render app warm

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "*/5 5 * * *"  # 05:00~05:55 UTC = 한국시간 14:00~14:55, 모의투자 배치(14:30) 직전 구간 보강
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production site (콜드스타트 감안해 넉넉히 대기)
        run: |
          curl -sS --max-time 150 -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
            https://stock-tracker-5gy3.onrender.com/login
