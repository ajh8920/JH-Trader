# Render 무료 웹서비스는 15분간 요청이 없으면 컨테이너가 잠든다. 이 앱은 매일
# 한국시간 14:30에 모의투자(어나니머스/스위퍼/와쳐 등) 매매를 처리하고 메일을
# 보내는 백그라운드 스레드(app.py의 paper_trading_scheduler)를 프로세스 안에서
# 직접 스케줄링하는데, 그 시각에 서버가 잠들어 있으면(방문자가 없으면) 스레드
# 자체가 깨어있지 않아 조용히 그날을 건너뛴다(예외가 안 나서 로그에도 안 남는다
# - 2026-09-09 와쳐 알림 메일 누락으로 실제 확인됨. trend_screen_refresher 등
# 다른 주기적 갱신 스레드도 같은 이유로 여러 날 멈춰 있었다).
#
# **2026-10-22 수정 - 하루 종일(10분마다) 깨워두던 것을 없앴다.** Render 무료
# 티어는 콜드슬립 자체와 별개로 "워크스페이스당 월 750 Free instance hours"
# 한도가 있다(render.com/docs/free) - 하루 종일 깨어있으면 한 달에 720~744시간을
# 써서 한도에 거의 또는 완전히 걸리고, 넘으면 그 달 남은 기간 전체 Free 서비스가
# 정지된다(콜드슬립보다 훨씬 나쁜 결과). 그래서 실제로 필요한 시간대만 깨운다:
# - 모의투자 배치(14:30) 직전 구간(14:00~14:55)만 5분 간격으로 보강 -
#   watcher-batch-trigger.yml이 14:30에 배치 엔드포인트를 직접 호출하긴 하지만,
#   그 호출 자체가 "콜드스타트 + 배치 처리"를 한 번에 떠안지 않도록 미리 깨워둔다.
# - 무한매수 자동매매(17:00~18:45)는 auto-infinite-trigger.yml이 그 시간대에
#   직접 엔드포인트를 호출해 똑같이 깨우는 역할을 겸하므로 여기서 또 핑을
#   보낼 필요가 없다.
# 이렇게 제한해도 한 달 예상 사용량은 100시간이 채 안 돼 750시간 한도에 여유가
# 크다. (UptimeRobot처럼 24시간 계속 핑을 보내는 외부 모니터링 도구는 이 한도를
# 그대로 다시 소진시키므로 같이 쓰지 않는다 - CLAUDE.md/대화 기록 참고.)
name: Keep Render app warm

on:
  schedule:
    - cron: "*/5 5 * * *"  # 05:00~05:55 UTC = 한국시간 14:00~14:55, 모의투자 배치(14:30) 직전 구간만
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production site (콜드스타트 감안해 넉넉히 대기)
        run: |
          curl -sS --max-time 150 -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
            https://stock-tracker-5gy3.onrender.com/login
