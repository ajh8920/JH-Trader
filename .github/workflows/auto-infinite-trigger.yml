# 무한매수법 2.2 자동매매(auto_infinite_scheduler)는 인메모리 "17:00까지 sleep"
# 타이머라, watcher-batch-trigger.yml과 똑같은 콜드슬립 위험을 안고 있다 - 컨테이너가
# 16:59~17:xx 사이에 잠들었다 늦게 깨어나면 그 스레드가 "다음 17시"를 내일로 계산해
# 버려서 그날 자동매매 제출이 통째로 스킵된다. 여기는 실제 돈이 걸린 기능이라 더
# 엄격하게, 제출 시간대(17시대)와 실패확인 시간대(18시대)에 걸쳐 여러 번 호출한다.
#
# /api/cron/run-auto-infinite는 호출마다 현재 한국시간을 스스로 보고 "지금이 어느
# 시간대인지" 판단하므로, 아래 스케줄이 정확히 몇 분 밀려도(GitHub Actions 스케줄은
# 정시 실행을 보장하지 않는다 - 공지된 한계) 안전하다(auto_last_run_date/
# auto_last_failure_notified_date 가드와 refresh_fill_status의 멱등성으로 중복
# 호출이 안전함).
#
# 2026-10-22 추가 - 06:00~07:40 KST 체결확인 구간(사용자 지적: "LOC라서 오전5시에
# 매매되는데 이 기록은 언제 저장됩니까?"). LOC/MOC는 제출 당일(17시)이 아니라
# 그날 밤~다음날 새벽 미국장 마감 때 체결되는데, 지금까지는 사용자가 무한매수
# 탭에서 "체결확인" 버튼을 눌러야만 반영됐다 - 이게 단순 가시성 문제가 아니라,
# 다음날 17시 제출 로직(compute_live_status)이 "체결 확인 안 된" 전날 주문을
# 모른 채 사다리를 다시 계산해 중복/어긋난 주문을 낼 수 있는 정확성 문제였다
# (app.py의 _refresh_all_auto_infinite_fills 참고). 금요일 17시 주문은 토요일
# 새벽에 체결되므로 이 구간은 UTC 평일(1-5)로 돌려야 한국시간 화~토요일 아침을
# 전부 커버한다(UTC 월~금 저녁 = 한국시간 화~토 새벽).
name: Trigger Auto-Infinite scheduler

on:
  schedule:
    - cron: "0,20,40 21,22 * * 1-5"  # 21:00~22:40 UTC = 한국시간 06:00~07:40(다음날), UTC 평일만 (체결확인)
    - cron: "0,15,30,45 8 * * 1-5"  # 08:00~08:45 UTC = 한국시간 17:00~17:45, 평일만 (제출 시도)
    - cron: "0,15,30,45 9 * * 1-5"  # 09:00~09:45 UTC = 한국시간 18:00~18:45, 평일만 (실패 확인)
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 무한매수 자동매매 트리거 호출 (콜드스타트 감안해 넉넉히 대기)
        run: |
          curl -sS --max-time 150 -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            https://stock-tracker-5gy3.onrender.com/api/cron/run-auto-infinite
