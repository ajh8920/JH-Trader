<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 미국 주식 목표가 트래커</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
</head>
<body>
  <div class="app" style="max-width:380px;padding-top:4rem;">
    <header class="header" style="margin-bottom:1.5rem;">
      <i class="ti ti-chart-candle header-icon" aria-hidden="true"></i>
      <div>
        <h1 class="header-title">로그인</h1>
        <p class="header-sub">미국 주식 목표가 트래커</p>
      </div>
    </header>

    <div class="card">
      {% if error %}
      <div class="error-msg"><i class="ti ti-alert-circle" aria-hidden="true"></i>{{ error }}</div>
      {% endif %}
      <form method="post" style="display:flex;flex-direction:column;gap:10px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="text" name="username" placeholder="아이디" required autofocus />
        <input type="password" name="password" placeholder="비밀번호" required />
        <button type="submit" class="btn-primary" style="justify-content:center;">
          <i class="ti ti-login" aria-hidden="true"></i> 로그인
        </button>
      </form>
    </div>

    <p style="text-align:center;font-size:13px;color:var(--text-secondary);">
      계정이 없으신가요? <a href="/register">회원가입</a>
    </p>
  </div>
</body>
</html>
