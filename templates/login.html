<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 미국 주식 목표가 트래커</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <script>
    // 저장된 테마를 body 렌더링 전에 즉시 적용해 화면 깜빡임을 방지합니다.
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="auth-body">
  {% include "_auth_backdrop.html" %}

  <div class="auth-veil">
    <div class="auth-modal">
      <div class="auth-modal-brand">
        <i class="ti ti-chart-candle" aria-hidden="true"></i>
        <span>미국 주식 목표가 트래커</span>
      </div>
      <h1 class="auth-modal-title">로그인</h1>
      <p class="auth-modal-sub">계정으로 계속하기</p>

      {% if error %}
      <div class="error-msg"><i class="ti ti-alert-circle" aria-hidden="true"></i>{{ error }}</div>
      {% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="text" name="username" placeholder="아이디" required autofocus />
        <input type="password" name="password" placeholder="비밀번호" required />
        <button type="submit" class="btn-primary auth-submit">
          <i class="ti ti-login" aria-hidden="true"></i> 로그인
        </button>
      </form>
      <p class="auth-modal-switch">계정이 없으신가요? <a href="/register">회원가입</a></p>
    </div>
  </div>
</body>
</html>
