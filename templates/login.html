{% from "_macros.html" import brand_mark %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · JH-Trader</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <script>
    // 저장된 테마를 body 렌더링 전에 즉시 적용해 화면 깜빡임을 방지합니다.
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="auth-body">
  {% include "_auth_backdrop.html" %}

  <div class="auth-veil">
    <div class="auth-modal">
      <div class="auth-modal-brand">
        {{ brand_mark(20) }}
        <span>JH-Trader</span>
      </div>
      <h1 class="auth-modal-title">Log in</h1>
      <p class="auth-modal-sub">Continue with your account</p>

      {% if error %}
      <div class="error-msg"><i class="ti ti-alert-circle" aria-hidden="true"></i>{{ error }}</div>
      {% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="text" name="username" placeholder="Username" required autofocus />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit" class="btn-primary auth-submit">
          <i class="ti ti-login" aria-hidden="true"></i> Log in
        </button>
      </form>
      <p class="auth-modal-switch">Don't have an account? <a href="/register">Sign up</a></p>
    </div>
  </div>
</body>
</html>
