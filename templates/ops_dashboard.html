<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JH-Trader 운영 대시보드</title>
<style>
/* 레이아웃: 상단 HUD(집계 카운터) → 가운데 "타운"(실제 인프라 7개를 건물로
   매핑) → 하단 터미널풍 운영 로그. Claude가 작성한 claude.ai Artifact 버전
   (수동 새로고침)과 달리 이 페이지는 Flask가 직접 서빙하므로 /api/ops/status를
   동일 출처에서 바로 폴링할 수 있다 - 진짜 실시간(20초 간격 자동 갱신). */
:root{
  color-scheme: dark;
  --sky-top:#0a0d22; --sky-mid:#141a3c; --sky-horizon:#262c5e;
  --ground:#0d1026; --panel:#131833; --panel-edge:#2a3161;
  --ink:#eef0ff; --ink-dim:#8d93c4; --ink-faint:#5b6190;
  --accent:#57d6e8; --accent-warm:#ffd766;
  --ok:#52e39a; --warn:#ffb93d; --err:#ff5c7a; --unknown:#555c8c;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --pixel: 'Press Start 2P', var(--mono);
  --grass:#7ad9a3; --grass-mid:#64c890; --grass-deep:#4fae7a;
  --tree-a:#285c34; --tree-b:#357b40; --tree-c:#469652; --trunk:#5c3a22;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--sky-top); color:var(--ink);
  font-family:var(--mono);
  background-image:
    radial-gradient(1px 1px at 8% 15%, rgba(255,255,255,.55) 0, transparent 60%),
    radial-gradient(1px 1px at 22% 8%, rgba(255,255,255,.4) 0, transparent 60%),
    radial-gradient(1px 1px at 38% 22%, rgba(255,255,255,.5) 0, transparent 60%),
    radial-gradient(1px 1px at 55% 6%, rgba(255,255,255,.35) 0, transparent 60%),
    radial-gradient(1px 1px at 68% 18%, rgba(255,255,255,.5) 0, transparent 60%),
    radial-gradient(1px 1px at 82% 9%, rgba(255,255,255,.4) 0, transparent 60%),
    radial-gradient(1px 1px at 92% 20%, rgba(255,255,255,.45) 0, transparent 60%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-horizon) 100%);
}
.wrap{max-width:1180px; margin:0 auto; padding-block:20px 40px;}
.title-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:0 16px;}
h1{font-family:var(--pixel); font-size:15px; line-height:1.6; margin:0; color:var(--accent); text-shadow:0 0 10px rgba(87,214,232,.5); text-wrap:balance;}
.subtitle{color:var(--ink-dim); font-size:12px;}
.live-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:10px; color:var(--ok);
  border:1px solid var(--ok); border-radius:10px; padding:2px 8px 2px 6px;
}
.live-chip .dot{width:6px; height:6px; border-radius:50%; background:var(--ok); animation:livepulse 1.6s ease-in-out infinite;}
.live-chip.down{color:var(--err); border-color:var(--err);}
.live-chip.down .dot{background:var(--err); animation:none;}
@keyframes livepulse{0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(82,227,154,.6)} 50%{opacity:.5; box-shadow:0 0 0 4px rgba(82,227,154,0)}}

/* ── HUD 바 ───────────────────────────────────────────────────────── */
.hud{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr));
  gap:2px; margin:16px; background:var(--panel-edge); border:2px solid var(--panel-edge);
  box-shadow:0 0 0 4px var(--ground), 0 6px 18px rgba(0,0,0,.45);
}
.hud-cell{
  background:var(--panel); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0;
}
.hud-label{font-size:10px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase;}
.hud-value{font-family:var(--pixel); font-size:17px; font-variant-numeric:tabular-nums; line-height:1.3;}
.hud-value.ok{color:var(--ok)} .hud-value.warn{color:var(--warn)} .hud-value.err{color:var(--err)}
.hud-sub{font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums;}

/* ── 마을 장면(낮) ────────────────────────────────────────────────── */
.town-frame{
  position:relative; margin:16px; padding:40px 30px 30px; border-radius:10px; overflow:hidden;
  background:
    radial-gradient(1200px 300px at 50% -40%, rgba(255,255,255,.18), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 3px, transparent 3px 26px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 3px, transparent 3px 26px),
    linear-gradient(180deg, var(--grass) 0%, var(--grass-mid) 70%, var(--grass-deep) 100%);
  box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 4px rgba(255,255,255,.25), inset 0 0 0 8px rgba(40,92,52,.5);
}
.tree-ring{position:absolute; inset:0; pointer-events:none; z-index:1;}
.tree{position:absolute; width:34px; height:34px;}
.tree i{
  position:absolute; inset:0; display:block; border-radius:50%;
  background:
    radial-gradient(circle at 34% 30%, var(--tree-c) 0 44%, transparent 45%),
    radial-gradient(circle at 66% 38%, var(--tree-b) 0 48%, transparent 49%),
    radial-gradient(circle at 50% 60%, var(--tree-a) 0 56%, transparent 57%);
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.22));
}
.tree b{position:absolute; left:47%; bottom:-4px; width:3px; height:7px; background:var(--trunk); border-radius:1px;}
.town{
  position:relative; z-index:2; display:flex; align-items:flex-end; justify-content:center;
  gap:18px; flex-wrap:wrap; min-height:190px; padding-top:6px;
}
.garden-strip{
  position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
  gap:28px; flex-wrap:wrap; padding:14px 0 0;
}
.pond{width:118px; height:66px; position:relative;}
.pond svg{width:100%; height:100%; display:block; filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));}
.flowers{width:72px; height:30px; border-radius:6px;
  background-image:
    radial-gradient(circle at 10% 60%, #fff 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 22% 30%, #ff6f91 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 36% 70%, #ffe17a 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 50% 35%, #fff 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 64% 65%, #ff6f91 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 78% 32%, #fff 0 2.6px, transparent 3.2px),
    radial-gradient(circle at 90% 62%, #ffe17a 0 2.6px, transparent 3.2px);
}
.path-sign{width:64px; height:44px; position:relative;}
.path-sign svg{width:100%; height:100%; display:block; filter:drop-shadow(0 3px 0 rgba(0,0,0,.18));}

/* ── 건물(주택/센터) 버튼 - 클릭하면 카드가 뒤집히며 뒷면에 세부지표가 나온다. ── */
.bldg{
  --glow: var(--unknown);
  position:relative; z-index:3; width:118px; display:flex; flex-direction:column; align-items:center;
  background:none; border:none; padding:0; cursor:pointer; font-family:inherit; color:inherit;
  perspective:900px;
}
.bldg.is-hall{width:146px;}
.bldg .house-wrap{width:100%;}
.bldg svg.house{width:100%; height:auto; display:block; filter:drop-shadow(0 4px 1px rgba(0,0,0,.28));}
.bldg .plaque{
  margin-top:6px; background:var(--panel-edge); color:var(--ink); font-size:9.5px; text-align:center;
  padding:5px 7px; line-height:1.5; min-height:28px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; border-radius:3px; box-shadow:0 2px 0 rgba(0,0,0,.35); width:max-content; max-width:none;
}
.bldg .plaque .pl-name{white-space:nowrap; font-weight:700;}
.bldg .plaque .pl-sub{white-space:nowrap; color:var(--ink-faint); font-size:8.6px; margin-top:1px;}
.bldg .badge{
  position:absolute; top:-8px; right:2px; font-size:9px; letter-spacing:.03em; font-weight:700;
  padding:3px 6px; border-radius:2px; color:#081018; background:var(--glow); box-shadow:0 2px 6px rgba(0,0,0,.4);
  z-index:4;
}
.flip{
  display:block; position:relative; width:100%; transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.45,.05,.15,1);
}
.bldg.open .flip{transform:rotateY(180deg);}
.flip-face{backface-visibility:hidden; -webkit-backface-visibility:hidden;}
.flip-front{display:flex; flex-direction:column; align-items:center;}
.flip-back{
  position:absolute; inset:0; width:100%;
  transform:rotateY(180deg); background:rgba(8,10,24,.94); border:1px solid var(--panel-edge);
  border-radius:6px; padding:9px 8px 10px; box-shadow:0 10px 26px rgba(0,0,0,.5);
  max-height:230px; overflow-y:auto; text-align:left;
}
.flip-back .back-title{display:block; color:var(--ink); font-size:10.5px; font-weight:700; margin-bottom:5px;}
.flip-back .back-body{font-size:10px; color:var(--ink-dim); line-height:1.6;}
.flip-back .back-body b{color:var(--ink); font-variant-numeric:tabular-nums;}
.flip-back .back-body .err-line{color:var(--err); display:block; margin-top:4px; word-break:break-word;}
.flip-back .back-body i{color:var(--ink-faint); font-style:normal;}

/* ── 주민(에이전트) ──────────────────────────────────────────────── */
.lot{position:relative; display:flex; flex-direction:column; align-items:center;}
.nameplate{
  font-size:8.5px; letter-spacing:.02em; color:#eaf6ff; background:#2d6fa3;
  border:1px solid #4fa8e8; border-radius:3px; padding:3px 7px; margin-bottom:6px;
  box-shadow:0 2px 0 rgba(0,0,0,.35); white-space:nowrap;
}
.ground{position:relative; width:100%; height:40px; flex:0 0 auto;}
.walker{
  position:absolute; left:50%; bottom:2px; width:20px; height:26px;
  margin-left:-10px; animation:patrol var(--patrol-dur,4.5s) ease-in-out infinite;
  animation-delay:var(--patrol-delay,0s); filter:drop-shadow(0 2px 1px rgba(0,0,0,.5));
}
.walker .char{width:100%; height:100%; display:block; animation:bob 1.8s ease-in-out infinite; animation-delay:var(--patrol-delay,0s);}
.walker .leg{animation:leg-step .42s steps(1) infinite;}
.walker .leg-r{animation-delay:.21s;}
.walker.mood-sleep{animation:none; left:calc(50% - 10px); margin-left:0;}
.walker.mood-sleep .char{animation:none; transform:rotate(-9deg); transform-origin:50% 95%;}
.walker.mood-sleep .leg{animation:none;}
.walker.mood-idle{animation:none; left:calc(50% - 10px); margin-left:0;}
.walker.mood-idle .char{animation:bob 2.6s ease-in-out infinite; opacity:.72;}
.walker.mood-idle .leg{animation:none;}
.walker.mood-alert{animation:shuffle .32s steps(2) infinite; left:calc(50% - 10px); margin-left:0;}
.walker.mood-alert .leg{animation-duration:.18s;}
.bubble{
  position:absolute; left:50%; top:-6px; transform:translateX(-50%); font-family:var(--pixel);
  font-size:9px; padding:3px 5px; border-radius:3px; background:var(--panel); border:1px solid var(--panel-edge);
  animation:bubble-float 1.6s ease-in-out infinite; white-space:nowrap; z-index:2;
}
.bubble.b-sleep{color:var(--ink-dim);}
.bubble.b-alert{color:var(--err); border-color:var(--err); animation-duration:.5s;}
@keyframes patrol{
  0%{transform:translateX(0) scaleX(1)}
  48%{transform:translateX(42px) scaleX(1)}
  50%{transform:translateX(42px) scaleX(-1)}
  98%{transform:translateX(0) scaleX(-1)}
  100%{transform:translateX(0) scaleX(1)}
}
@keyframes shuffle{
  0%,100%{transform:translateX(-5px) scaleX(-1)}
  50%{transform:translateX(5px) scaleX(1)}
}
@keyframes leg-step{0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.4px)}}
@keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.2px)}}
@keyframes bubble-float{0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
  .walker, .walker .char, .walker .leg, .bubble{animation:none !important;}
  .flip{transition:none !important;}
}

/* ── 로그 패널 ───────────────────────────────────────────────────── */
.log-panel{
  margin:20px 16px 0; background:#07091c; border:2px solid var(--panel-edge); border-radius:3px;
  overflow:hidden;
}
.log-head{
  background:var(--panel-edge); color:var(--ink); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  padding:7px 12px; display:flex; justify-content:space-between;
}
.log-body{padding:10px 12px; max-height:260px; overflow-y:auto;}
.log-row{display:flex; gap:10px; font-size:11.5px; padding:5px 0; border-bottom:1px dotted rgba(255,255,255,.07);}
.log-row:last-child{border-bottom:none}
.log-tag{flex:0 0 auto; padding:1px 6px; border-radius:2px; font-size:9.5px; font-weight:700; color:#081018; align-self:flex-start;}
.log-tag.ok{background:var(--ok)} .log-tag.warn{background:var(--warn)} .log-tag.err{background:var(--err)} .log-tag.info{background:var(--accent)}
.log-text{color:var(--ink-dim); min-width:0; word-break:break-word;}
.log-text b{color:var(--ink); font-weight:600;}
.empty{color:var(--ink-faint); font-size:11.5px; padding:14px 2px;}

.hint-bar{margin:14px 16px 0; font-size:11px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;}
.hint-bar button{
  font-family:var(--mono); font-size:10.5px; background:var(--panel); color:var(--accent);
  border:1px solid var(--panel-edge); padding:5px 9px; border-radius:2px; cursor:pointer;
}
.hint-bar button:active{transform:translateY(1px)}
.hint-bar button:disabled{opacity:.5; cursor:default;}

@media (max-width:460px){
  .bldg{width:30%; min-width:92px}
  .town-frame{padding:26px 14px 20px; margin:16px 10px;}
  .tree{width:24px; height:24px;}
  h1{font-size:12.5px}
}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1>JH-TRADER 운영 타운</h1>
    <span class="live-chip" id="liveChip"><span class="dot"></span>LIVE</span>
    <span class="subtitle" id="generatedLabel">첫 조회 중...</span>
  </div>

  <div class="hud" id="hud"></div>

  <div class="town-frame" id="townFrame">
    <div class="tree-ring" id="treeRing"></div>
    <div class="town" id="town" role="list" aria-label="인프라 컴포넌트"></div>
    <div class="garden-strip">
      <div class="pond" aria-hidden="true">
        <svg viewBox="0 0 118 66">
          <ellipse cx="59" cy="33" rx="58" ry="32" fill="#e8d4a0"/>
          <ellipse cx="59" cy="33" rx="48" ry="24" fill="#2f8fd4"/>
          <ellipse cx="55" cy="29" rx="38" ry="18" fill="#58b6ec"/>
          <path d="M26 26 Q40 20 54 26 T82 26" stroke="#bfeaff" stroke-width="2.4" fill="none" opacity=".8"/>
          <path d="M22 38 Q38 32 54 38 T90 38" stroke="#bfeaff" stroke-width="2.2" fill="none" opacity=".6"/>
        </svg>
      </div>
      <div class="flowers" aria-hidden="true"></div>
      <div class="path-sign" aria-hidden="true">
        <svg viewBox="0 0 64 44">
          <rect x="29" y="14" width="6" height="26" fill="#9c7a46"/>
          <rect x="16" y="4" width="32" height="16" rx="2" fill="#f2e2c0" stroke="#8a6a3c" stroke-width="2"/>
          <rect x="21" y="9" width="22" height="3" fill="#8a6a3c" opacity=".6"/>
          <rect x="21" y="14" width="14" height="3" fill="#8a6a3c" opacity=".4"/>
        </svg>
      </div>
      <div class="flowers" aria-hidden="true"></div>
    </div>
  </div>

  <div class="hint-bar">
    <span id="pollLabel">20초마다 자동 새로고침</span>
    <button type="button" id="refreshNow">지금 새로고침</button>
  </div>

  <div class="log-panel">
    <div class="log-head"><span>운영 로그</span><span id="logCount">0</span></div>
    <div class="log-body" id="logBody"><div class="empty">표시할 이벤트가 없습니다.</div></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ── 실제 인프라 7개 컴포넌트 → 건물 + 주민 매핑 (app.py의 OpsHeartbeat
  // 컴포넌트명과 1:1). capColor/bodyColor는 상태색과 안 겹치는 팔레트.
  var BUILDINGS = [
    { id:"api", name:"API 서버", sub:"workers 2", title:"시스템 관리인", kind:"server",
      capColor:"#57d6e8", bodyColor:"#2a3161",
      heartbeats:[], note:"요청이 처리되는 순간이 곧 생존 증거 - 이 스냅샷을 가져온 시점에 응답했다는 뜻." },
    { id:"db", name:"데이터베이스", sub:"Postgres", title:"데이터베이스지기", kind:"db",
      capColor:"#b48cff", bodyColor:"#352a61",
      heartbeats:[], note:null },
    { id:"alert", name:"알림 감시대", sub:"30초 주기", title:"알림 파수꾼", kind:"single",
      capColor:"#ffcf5c", bodyColor:"#5a4a1f",
      heartbeats:["alert_checker"] },
    { id:"quant", name:"국내 퀀트 시장", sub:"6시간 주기", title:"시세 상인", kind:"single",
      capColor:"#7ad1ff", bodyColor:"#1f3a5a",
      heartbeats:["kr_quant_price_cache_refresher"] },
    { id:"screen", name:"트렌드 스카우트 타워", sub:"12시간 주기", title:"정찰병", kind:"dual",
      capColor:"#ff9f6b", bodyColor:"#5a331f",
      heartbeats:["trend_screen_refresher_KR","trend_screen_refresher_US"] },
    { id:"fund", name:"재무데이터 제철소", sub:"1~6시간 주기", title:"재무 세공사", kind:"dual",
      capColor:"#d9a86c", bodyColor:"#4a3b22",
      heartbeats:["us_fundamentals_refresher","dart_fundamentals_refresher"] },
    { id:"batch", name:"일일 배치 시계탑", sub:"14:30 KST", title:"배치 종지기", kind:"single",
      capColor:"#ff8fc9", bodyColor:"#5a1f45",
      heartbeats:["paper_trading_scheduler"] }
  ];

  function charSvg(capColor, bodyColor){
    return '<svg class="char" viewBox="0 0 20 26" shape-rendering="crispEdges" aria-hidden="true">' +
      '<ellipse cx="10" cy="25" rx="6" ry="1.4" fill="rgba(0,0,0,.4)"/>' +
      '<rect class="leg leg-l" x="6" y="18" width="3" height="6" fill="#1c2042"/>' +
      '<rect class="leg leg-r" x="11" y="18" width="3" height="6" fill="#1c2042"/>' +
      '<rect x="5" y="10" width="10" height="9" rx="1.5" fill="'+bodyColor+'"/>' +
      '<rect x="2" y="11" width="3" height="6" rx="1.2" fill="#f2c094"/>' +
      '<rect x="15" y="11" width="3" height="6" rx="1.2" fill="#f2c094"/>' +
      '<rect x="5" y="2" width="10" height="9" rx="2" fill="#f2c094"/>' +
      '<rect x="4" y="0" width="12" height="4.2" rx="1.6" fill="'+capColor+'"/>' +
      '<rect x="7.3" y="6" width="1.6" height="2" fill="#1c2042"/>' +
      '<rect x="11.1" y="6" width="1.6" height="2" fill="#1c2042"/>' +
      '</svg>';
  }
  function moodFor(status){
    if (status === "ok") return "walk";
    if (status === "stale") return "sleep";
    if (status === "error") return "alert";
    return "idle";
  }
  function bubbleFor(mood){
    if (mood === "sleep") return '<span class="bubble b-sleep">Z z</span>';
    if (mood === "alert") return '<span class="bubble b-alert">!</span>';
    return "";
  }

  function cottageSvg(glowColor, flagColor){
    return '<svg class="house" viewBox="0 0 118 104" aria-hidden="true">' +
      '<ellipse cx="59" cy="98" rx="46" ry="6" fill="rgba(0,0,0,.18)"/>' +
      '<polygon points="59,6 110,46 100,46 100,50 18,50 18,46 8,46" fill="#e8622f"/>' +
      '<polygon points="59,6 59,16 14,48 8,46" fill="#c84b20"/>' +
      '<rect x="56" y="6" width="6" height="5" fill="#c84b20"/>' +
      '<rect x="58.3" y="0" width="1.6" height="8" fill="#5c4326"/>' +
      '<polygon points="60,0.5 72,3 60,5.5" fill="'+flagColor+'"/>' +
      '<rect x="18" y="48" width="82" height="42" fill="#f2e2c0"/>' +
      '<rect x="18" y="48" width="82" height="6" fill="#ddc89a"/>' +
      '<rect x="18" y="84" width="82" height="6" fill="#ddc89a"/>' +
      '<rect x="50" y="64" width="18" height="26" rx="1" fill="#6e3524"/>' +
      '<circle cx="64" cy="78" r="1.6" fill="#f2c094"/>' +
      '<rect x="27" y="60" width="18" height="16" rx="1" fill="#2a3448"/>' +
      '<rect x="27" y="60" width="18" height="16" rx="1" fill="'+glowColor+'" opacity=".55"/>' +
      '<rect x="35.2" y="60" width="1.6" height="16" fill="#1c2436"/><rect x="27" y="67.2" width="18" height="1.6" fill="#1c2436"/>' +
      '<rect x="73" y="60" width="18" height="16" rx="1" fill="#2a3448"/>' +
      '<rect x="73" y="60" width="18" height="16" rx="1" fill="'+glowColor+'" opacity=".55"/>' +
      '<rect x="81.2" y="60" width="1.6" height="16" fill="#1c2436"/><rect x="73" y="67.2" width="18" height="1.6" fill="#1c2436"/>' +
      '<rect x="18" y="48" width="82" height="42" fill="none" stroke="#8a6a3c" stroke-width="2"/>' +
      '</svg>';
  }

  function hallSvg(glowColor, accentColor){
    return '<svg class="house" viewBox="0 0 150 104" aria-hidden="true">' +
      '<ellipse cx="75" cy="98" rx="58" ry="6" fill="rgba(0,0,0,.18)"/>' +
      '<rect x="60" y="4" width="8" height="12" fill="#8992a6"/>' +
      '<circle cx="64" cy="4" r="3" fill="'+accentColor+'"/>' +
      '<rect x="10" y="20" width="130" height="14" rx="2" fill="#49546b"/>' +
      '<rect x="18" y="14" width="22" height="8" rx="1" fill="#8992a6"/>' +
      '<rect x="14" y="34" width="122" height="56" fill="#d7dbe3"/>' +
      '<rect x="14" y="34" width="122" height="8" fill="#aeb6c7"/>' +
      '<rect x="14" y="82" width="122" height="8" fill="#aeb6c7"/>' +
      '<rect x="22" y="46" width="106" height="20" rx="1" fill="#1b2334"/>' +
      '<rect x="22" y="46" width="106" height="20" rx="1" fill="'+glowColor+'" opacity=".5"/>' +
      '<rect x="22" y="55" width="106" height="1.6" fill="#0d1120" opacity=".7"/>' +
      '<rect x="44.5" y="46" width="1.6" height="20" fill="#0d1120" opacity=".5"/>' +
      '<rect x="74.2" y="46" width="1.6" height="20" fill="#0d1120" opacity=".5"/>' +
      '<rect x="103.9" y="46" width="1.6" height="20" fill="#0d1120" opacity=".5"/>' +
      '<rect x="66" y="70" width="18" height="20" rx="1" fill="#6e3524"/>' +
      '<rect x="14" y="34" width="122" height="56" fill="none" stroke="'+accentColor+'" stroke-width="2" opacity=".55"/>' +
      '</svg>';
  }

  function buildTreeRing(){
    var ring = document.getElementById("treeRing");
    if (!ring) return;
    var html = "";
    function place(left, top, scale){
      html += '<span class="tree" style="left:'+left+'%; top:'+top+'%; transform:scale('+scale+')"><i></i><b></b></span>';
    }
    var topXs = [1,8,16,24,32,40,48,56,64,72,80,88,95];
    topXs.forEach(function(x,i){ place(x, i%2?0.5:1.5, i%3===0?1.1:0.95); });
    var botXs = [2,10,19,28,37,46,55,64,73,82,91,98];
    botXs.forEach(function(x,i){ place(x, i%2? 98.5:97.5, i%3===1?1.1:0.95); });
    var sideYs = [12,26,40,55,70,84];
    sideYs.forEach(function(y,i){ place(i%2?1.3:0.5, y, i%2?1:0.9); });
    sideYs.forEach(function(y,i){ place(i%2?98.2:99, y+6, i%2?0.9:1); });
    ring.innerHTML = html;
  }

  var INCIDENT_LOG = [
    { tag:"err", text:"<b>2026-10-16</b> Render Blueprint sync 버그로 DATABASE_URL이 매 배포마다 빈 DB로 덮어써짐 → ajh 계정 로그인 불가. render.yaml에 sync:false 추가로 해결." },
    { tag:"warn", text:"<b>2026-10-16</b> 일일 배치 크론이 워커 OOM으로 조용히 스킵되어 매매 알림 메일 미발송. 수동 트리거로 복구, 전 컴포넌트에 하트비트 계측 추가." }
  ];

  var statusEl = { hud: document.getElementById("hud"), town: document.getElementById("town"),
    generated: document.getElementById("generatedLabel"), logBody: document.getElementById("logBody"),
    logCount: document.getElementById("logCount"), liveChip: document.getElementById("liveChip") };

  // 서버(app.py)가 datetime.utcnow().isoformat()로 보내는 타임스탬프는
  // 타임존 표기가 없는 naive UTC 문자열이다 - 'Z'/오프셋이 없는 ISO
  // 문자열을 new Date()에 그대로 넣으면 브라우저가 "로컬 타임존 시각"으로
  // 오해석해(이 서버가 있는 곳 기준 UTC+9라 실제로 9시간씩 어긋났었다)
  // "방금 갱신됐는데 9시간 전"처럼 틀리게 보인다 - 운영 모니터링 화면에서
  // 치명적이라 여기서 'Z'를 붙여 명시적으로 UTC로 해석시킨다.
  function parseIsoUtc(iso){
    if (!iso) return null;
    var s = /[Zz]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z";
    return new Date(s);
  }
  function fmtRel(iso){
    var d = parseIsoUtc(iso);
    if (!d) return "기록 없음";
    var ms = Date.now() - d.getTime();
    if (ms < 0) ms = 0;
    var s = Math.floor(ms/1000);
    if (s < 60) return s + "초 전";
    var m = Math.floor(s/60); if (m < 60) return m + "분 전";
    var h = Math.floor(m/60); if (h < 48) return h + "시간 전";
    return Math.floor(h/24) + "일 전";
  }
  function fmtClock(iso){
    var d = parseIsoUtc(iso);
    if (!d) return "-";
    try{
      return d.toLocaleString("ko-KR", { hour12:false, month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    }catch(e){ return iso; }
  }
  function statusColorVar(s){
    if (s === "ok") return "var(--ok)";
    if (s === "warn" || s === "stale") return "var(--warn)";
    if (s === "error") return "var(--err)";
    return "var(--unknown)";
  }
  function statusColorHex(s){
    if (s === "ok") return "#52e39a";
    if (s === "warn" || s === "stale") return "#ffb93d";
    if (s === "error") return "#ff5c7a";
    return "#555c8c";
  }
  function statusLabel(s){
    if (s === "ok") return "정상";
    if (s === "stale") return "지연";
    if (s === "error") return "오류";
    return "대기";
  }
  function worstStatus(list){
    var order = { error:3, stale:2, unknown:1, ok:0 };
    var best = "ok", bestScore = -1;
    list.forEach(function(s){ var sc = order[s] == null ? 1 : order[s]; if (sc > bestScore){ bestScore = sc; best = s; } });
    return list.length ? best : "unknown";
  }

  function renderLot(cfg){
    var houseHtml = cfg.isHall ? hallSvg(statusColorHex(cfg.status), cfg.capColor) : cottageSvg(statusColorHex(cfg.status), cfg.capColor);
    var mood = moodFor(cfg.status);
    var dur = (3.6 + (cfg.idx % 4) * 0.55).toFixed(2);
    var delay = -(cfg.idx * 0.9).toFixed(2);
    var walkerStyle = '--patrol-dur:'+dur+'s; --patrol-delay:'+delay+'s;';
    return '<div class="lot">' +
      '<span class="nameplate">'+cfg.title+'</span>' +
      '<button type="button" class="bldg'+(cfg.isHall?' is-hall':'')+'" data-bldg="'+(cfg.id||'')+'" style="--glow:'+statusColorVar(cfg.status)+'" role="listitem">' +
        '<span class="badge">'+statusLabel(cfg.status)+'</span>' +
        '<span class="flip">' +
          '<span class="flip-face flip-front">' +
            '<span class="house-wrap">'+houseHtml+'</span>' +
            '<span class="plaque"><span class="pl-name">'+cfg.name+'</span><span class="pl-sub">'+cfg.sub+'</span></span>' +
          '</span>' +
          '<span class="flip-face flip-back">' +
            '<span class="back-title">'+cfg.name+'</span>' +
            '<span class="back-body">'+cfg.detailHtml+(cfg.note?('<br><br><i>'+cfg.note+'</i>'):'')+'</span>' +
          '</span>' +
        '</span>' +
      '</button>' +
      '<div class="ground">' +
        bubbleFor(mood) +
        '<div class="walker mood-'+mood+'" style="'+walkerStyle+'">'+charSvg(cfg.capColor, cfg.bodyColor)+'</div>' +
      '</div>' +
    '</div>';
  }

  function render(data){
    var compMap = {};
    (data.components || []).forEach(function(c){ compMap[c.name] = c; });

    var okCount = 0, warnCount = 0, errCount = 0;
    (data.components || []).forEach(function(c){
      if (c.status === "ok") okCount++;
      else if (c.status === "error") errCount++;
      else if (c.status === "stale") warnCount++;
    });
    var total = (data.components || []).length;
    var dbOk = data.db && data.db.ok;
    var hudCells = [
      { label:"정상 컴포넌트", value: okCount + " / " + total, cls: errCount ? "warn" : "ok" },
      { label:"주의·오류", value: (warnCount+errCount) + "건", cls: (warnCount+errCount) ? (errCount ? "err":"warn") : "ok" },
      { label:"데이터베이스", value: dbOk ? "연결됨" : "장애", cls: dbOk ? "ok" : "err",
        sub: dbOk && data.db.latencyMs != null ? (data.db.latencyMs + " ms") : "" },
      { label:"마지막 조회", value: fmtRel(data.generatedAt), cls:"", sub: fmtClock(data.generatedAt) }
    ];
    statusEl.hud.innerHTML = hudCells.map(function(c){
      return '<div class="hud-cell"><span class="hud-label">'+c.label+'</span>' +
        '<span class="hud-value '+(c.cls||"")+'">'+c.value+'</span>' +
        (c.sub ? '<span class="hud-sub">'+c.sub+'</span>' : '') + '</div>';
    }).join("");
    statusEl.generated.textContent = "마지막 조회: " + fmtClock(data.generatedAt) + " (" + fmtRel(data.generatedAt) + ")";

    statusEl.town.innerHTML = BUILDINGS.map(function(b, idx){
      var comps = b.heartbeats.map(function(h){ return compMap[h]; }).filter(Boolean);
      var status;
      if (b.kind === "server") status = "ok";
      else if (b.kind === "db") status = dbOk ? "ok" : "error";
      else status = worstStatus(comps.map(function(c){ return c.status; }));

      var isHall = (b.kind === "server" || b.kind === "db");
      var detailRows = "";
      if (b.kind === "server"){
        detailRows = '마지막 응답 확인: <b>' + fmtClock(data.generatedAt) + '</b><br>워커 2개 · 요청당 30초 제한';
      } else if (b.kind === "db"){
        detailRows = 'ping: <b>' + (dbOk ? "OK" : "실패") + '</b>' + (data.db.latencyMs != null ? ' · 지연 <b>'+data.db.latencyMs+'ms</b>' : '');
      } else {
        detailRows = comps.map(function(c){
          var line = c.name.replace(/_/g,' ') + ' — <b>' + statusLabel(c.status) + '</b> · 성공 ' + fmtRel(c.lastSuccessAt) +
            ' · 실행 ' + c.runCount + '회 · 오류 ' + c.errorCount + '회';
          if (c.lastError) line += '<span class="err-line">⚠ ' + c.lastError.slice(0,140) + '</span>';
          return line;
        }).join('<br><br>');
        if (!comps.length) detailRows = "데이터 없음";
      }

      return renderLot({ idx: idx, id: b.id, title: b.title, name: b.name, sub: b.sub,
        isHall: isHall, capColor: b.capColor, bodyColor: b.bodyColor, status: status,
        detailHtml: detailRows, note: b.note });
    }).join("");

    Array.prototype.forEach.call(document.querySelectorAll(".bldg"), function(el){
      el.addEventListener("click", function(){ el.classList.toggle("open"); });
    });

    var rows = [];
    (data.components || []).forEach(function(c){
      if (c.status === "error" && c.lastError){
        rows.push({ tag:"err", text:'<b>'+c.name+'</b> 오류 — ' + c.lastError.slice(0,180) });
      } else if (c.status === "stale"){
        rows.push({ tag:"warn", text:'<b>'+c.name+'</b> 마지막 성공 이후 지연 (' + fmtRel(c.lastSuccessAt) + ')' });
      }
    });
    (data.batchAccounts || []).forEach(function(a){
      rows.push({ tag:"ok", text:'<b>'+a.strategy+'</b>('+a.market+') 처리일 '+(a.lastProcessedDate||'-')+' · 알림 '+(a.lastAlertSentDate||'-') });
    });
    INCIDENT_LOG.forEach(function(e){ rows.push({ tag:e.tag, text:e.text }); });

    statusEl.logCount.textContent = String(rows.length);
    statusEl.logBody.innerHTML = rows.length ? rows.map(function(r){
      return '<div class="log-row"><span class="log-tag '+r.tag+'">'+r.tag.toUpperCase()+'</span><span class="log-text">'+r.text+'</span></div>';
    }).join("") : '<div class="empty">표시할 이벤트가 없습니다.</div>';
  }

  function setLive(ok){
    statusEl.liveChip.classList.toggle("down", !ok);
    statusEl.liveChip.innerHTML = ok ? '<span class="dot"></span>LIVE' : '<span class="dot"></span>조회 실패';
  }

  var refreshBtn = document.getElementById("refreshNow");
  var inFlight = false;
  function fetchStatus(){
    if (inFlight) return;
    inFlight = true;
    refreshBtn.disabled = true;
    fetch("/api/ops/status", { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(data){ setLive(true); render(data); })
      .catch(function(err){ console.error("ops status fetch failed", err); setLive(false); })
      .finally(function(){ inFlight = false; refreshBtn.disabled = false; });
  }

  refreshBtn.addEventListener("click", fetchStatus);

  buildTreeRing();
  fetchStatus();
  setInterval(fetchStatus, 20000);
})();
</script>
