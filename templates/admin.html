<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management · JH-Trader</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version('style.css') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <i class="ti ti-users header-icon" aria-hidden="true"></i>
      <div>
        <h1 class="header-title">User Management</h1>
        <p class="header-sub">Manage account roles (admin / user)</p>
      </div>
      <a href="/" class="settings-btn" title="Back to JH-Trader" aria-label="Back to JH-Trader">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
      </a>
    </header>

    <div id="admin-content"><div class="loading-msg"><i class="ti ti-loader-2" aria-hidden="true"></i>Loading...</div></div>

    <h2 style="font-size:15px;font-weight:700;margin:28px 0 4px;">📬 매매 알림 메일 관리</h2>
    <p style="font-size:12.5px;color:var(--text-muted,#888);margin:0 0 12px;">
      매일 한국시간 14:30에 그날의 모의투자 매매(신규진입/피라미딩/청산)를 전략별로 요약해 이 주소로 보냅니다.
      비워두면 그 계좌의 알림은 꺼진 상태입니다.
    </p>
    <div id="admin-alerts-content"><div class="loading-msg"><i class="ti ti-loader-2" aria-hidden="true"></i>Loading...</div></div>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `오류 (${res.status})`);
      return data;
    }

    async function loadUsers() {
      const el = document.getElementById('admin-content');
      try {
        const users = await api('GET', '/api/admin/users');
        renderUsers(users);
      } catch (e) {
        el.innerHTML = `<div class="error-msg"><i class="ti ti-alert-circle" aria-hidden="true"></i>${e.message}</div>`;
      }
    }

    function renderUsers(users) {
      const el = document.getElementById('admin-content');
      el.innerHTML = `
        <div class="pf-table-wrap">
          <table class="pf-table">
            <thead><tr><th>Username</th><th>Role</th><th>Joined</th><th></th></tr></thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td style="font-weight:600;">${escapeHtml(u.username)}</td>
                  <td>
                    <select onchange="changeRole(${u.id}, this.value)" style="font-size:13px;">
                      <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
                      <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option>
                    </select>
                  </td>
                  <td>${escapeHtml(u.createdAt)}</td>
                  <td><button class="btn-icon" onclick="deleteUser(${u.id}, this.closest('tr').querySelector('td').textContent.trim())" aria-label="Delete user"><i class="ti ti-trash" aria-hidden="true"></i></button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    async function changeRole(id, role) {
      try {
        await api('PATCH', `/api/admin/users/${id}/role`, { role });
        loadUsers();
      } catch (e) {
        alert(e.message);
        loadUsers();
      }
    }

    async function deleteUser(id, username) {
      if (!confirm(`${username} 계정을 삭제하시겠습니까? 포트폴리오와 알림도 함께 삭제됩니다.`)) return;
      try {
        await api('DELETE', `/api/admin/users/${id}`);
        loadUsers();
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadTradeAlerts() {
      const el = document.getElementById('admin-alerts-content');
      try {
        const accounts = await api('GET', '/api/admin/trade-alerts');
        renderTradeAlerts(accounts);
      } catch (e) {
        el.innerHTML = `<div class="error-msg"><i class="ti ti-alert-circle" aria-hidden="true"></i>${e.message}</div>`;
      }
    }

    function renderTradeAlerts(accounts) {
      const el = document.getElementById('admin-alerts-content');
      if (!accounts.length) {
        el.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><p>모의투자를 시작한 사용자가 아직 없습니다.</p></div>`;
        return;
      }
      el.innerHTML = `
        <div class="pf-table-wrap">
          <table class="pf-table">
            <thead><tr>
              <th>전략</th><th>사용자</th><th>상태</th><th>알림 이메일</th><th>마지막 처리일</th><th>마지막 발송일</th><th></th>
            </tr></thead>
            <tbody>
              ${accounts.map(a => `
                <tr>
                  <td>${escapeHtml(a.strategyLabel)}</td>
                  <td style="font-weight:600;">${escapeHtml(a.username)}</td>
                  <td>${a.isActive ? '활성' : '비활성'}</td>
                  <td><input type="email" id="alert-email-${a.accountId}" value="${escapeHtml(a.alertEmail || '')}" placeholder="you@example.com" style="width:220px;" /></td>
                  <td>${escapeHtml(a.lastProcessedDate || '-')}</td>
                  <td>${escapeHtml(a.lastAlertSentDate || '-')}</td>
                  <td style="white-space:nowrap;">
                    <button class="btn-primary" onclick="saveTradeAlertEmail(${a.accountId})" style="font-size:12.5px;padding:6px 12px;">저장</button>
                    <button class="btn-secondary" onclick="testTradeAlertEmail(${a.accountId})" style="font-size:12.5px;padding:6px 12px;">테스트 발송</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    }

    async function saveTradeAlertEmail(accountId) {
      const email = document.getElementById(`alert-email-${accountId}`).value.trim();
      try {
        await api('PATCH', `/api/admin/trade-alerts/${accountId}`, { email });
        alert(email ? '알림 이메일이 저장되었습니다.' : '알림 이메일을 껐습니다.');
        loadTradeAlerts();
      } catch (e) {
        alert(e.message);
      }
    }

    async function testTradeAlertEmail(accountId) {
      try {
        await api('POST', `/api/admin/trade-alerts/${accountId}/test`);
        alert('테스트 메일을 발송했습니다. 받은편지함(및 스팸함)을 확인하세요.');
      } catch (e) {
        alert(e.message);
      }
    }

    loadUsers();
    loadTradeAlerts();
  </script>
</body>
</html>
